name: AI Rescue Pack / Voucher / Sprint
about: Zamówienie po płatności Revolut/BLIK
labels: [order]
body:
  - type: markdown
    attributes:
      value: |
        Dzięki. GitHub Issues są publiczne. Nie wklejaj danych karty, prywatnych numerów płatności, haseł, tokenów ani poufnych danych. Wklej tylko brief i tytuł płatności.
  - type: dropdown
    id: product
    attributes:
      label: Co kupujesz?
      options:
        - AI Rescue Pack — 49 zł
        - AI Work Voucher — 250 zł
        - Overnight AI Sprint — 1000 zł
    validations:
      required: true
  - type: input
    id: payment_title
    attributes:
      label: Tytuł płatności Revolut/BLIK
      placeholder: np. Voucher AI Work
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Prywatność i bezpieczeństwo
      options:
        - label: Rozumiem, że to zgłoszenie jest publiczne na GitHubie.
          required: true
        - label: Nie wklejam danych karty, haseł, tokenów, dokumentów medycznych ani cudzych danych osobowych.
          required: true
        - label: Rozumiem, że płatność weryfikuje Paulina/Revolut/BLIK; Hermes nie ma dostępu do konta bankowego.
          required: true
  - type: textarea
    id: brief
    attributes:
      label: Brief
      description: Co mamy poprawić / przygotować / przeanalizować?
      placeholder: Link, kontekst, cel, odbiorca, deadline. Napisz też, gdzie wynik ma być użyty.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Materiał wejściowy
      description: Wklej tekst, link albo opis. Nie wklejaj sekretów ani prywatnych danych.
    validations:
      required: false
